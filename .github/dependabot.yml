version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*"]
        update-types: [minor, patch]
      test-tooling:
        patterns:
          ["vitest*", "@vitest/*", "playwright", "vite", "@vitejs/*", "typescript", "@types/*"]
        update-types: [minor, patch]
      maintenance:
        patterns: ["*"]
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
